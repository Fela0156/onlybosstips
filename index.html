
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>ONLYBOSSTIPS | Football Predictions</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
header{padding:22px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #252525}
.logo{font-size:25px;font-weight:900;color:#e6b83f}
nav a{color:#ddd;text-decoration:none;margin-left:18px;font-size:14px}
.hero{text-align:center;padding:65px 20px;background:linear-gradient(140deg,#171717,#080808)}
.hero h1{font-size:38px;margin:0 0 12px}
.hero h1 span{color:#e6b83f}
.hero p{color:#aaa}
section{padding:30px 6%;max-width:1100px;margin:auto}
h2{color:#e6b83f}
.card{background:#151515;border:1px solid #292929;border-radius:12px;padding:18px;margin:14px 0}
.teams{font-size:19px;font-weight:bold;margin:12px 0}
.muted{color:#aaa;font-size:13px}
.tag{display:inline-block;background:#292313;color:#e6b83f;padding:6px 10px;border-radius:6px;font-size:12px}
button{background:#e6b83f;color:#111;border:0;border-radius:7px;padding:12px 16px;font-weight:bold;cursor:pointer}
input,select{width:100%;padding:13px;margin:7px 0 14px;background:#222;color:white;border:1px solid #444;border-radius:7px}
label{font-size:13px;color:#ccc}
#admin{display:none}
#login{max-width:430px;margin:25px auto}
.actions button{margin:5px}
.danger{background:#a83232;color:white}
footer{text-align:center;padding:25px;color:#777;border-top:1px solid #252525}
</style>
</head>
<body>
<header>
<div class="logo">ONLYBOSSTIPS</div>
<nav><a href="#predictions">Predictions</a><a href="#results">Results</a><a href="#admin">Admin</a></nav>
</header>

<div class="hero">
<h1>WELCOME TO <span>ONLYBOSSTIPS</span></h1>
<p>Football predictions, match tips and results.</p>
<a href="#predictions"><button>VIEW PREDICTIONS</button></a>
</div>

<section id="predictions">
<h2>Today's Predictions</h2>
<div id="prediction-list"><p class="muted">Loading predictions...</p></div>
</section>

<section id="results">
<h2>Recent Results</h2>
<div id="result-list"><p class="muted">Results will appear here.</p></div>
</section>

<section>
<h2>Administrator Login</h2>
<div id="login" class="card">
<label>Email address</label>
<input id="email" type="email" placeholder="Admin email">
<label>Password</label>
<input id="password" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
<p id="message" class="muted"></p>
</div>
</section>

<section id="admin">
<h2>Admin Dashboard</h2>
<button onclick="logout()">LOG OUT</button>
<div class="card">
<h3>Post a Prediction</h3>
<label>League</label><input id="league" placeholder="Premier League">
<label>Home team</label><input id="home" placeholder="Home team">
<label>Away team</label><input id="away" placeholder="Away team">
<label>Prediction</label><input id="tip" placeholder="e.g. Home win">
<label>Odds</label><input id="odds" placeholder="e.g. 1.85">
<label>Kick-off date and time</label><input id="kickoff" type="datetime-local">
<button onclick="postPrediction()">PUBLISH PREDICTION</button>
<p id="admin-message" class="muted"></p>
</div>
<div id="admin-list"></div>
</section>

<footer>© 2026 ONLYBOSSTIPS. All rights reserved.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://mumntekskdfexzupjvmc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_JEaf2iqIFEXMyTwBOWrmxQ_-_R3G11d";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function safe(value){
 return String(value ?? "").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

async function loadPredictions(){
 const {data,error}=await db.from("predictions").select("*").order("created_at",{ascending:false});
 if(error){
  document.getElementById("prediction-list").innerHTML='<p class="muted">Predictions will appear here once the database is connected.</p>';
  return;
 }
 const upcoming=data.filter(x=>x.status!=="finished");
 const results=data.filter(x=>x.status==="finished");
 document.getElementById("prediction-list").innerHTML=upcoming.length?upcoming.map(card).join(""):'<p class="muted">No predictions published yet.</p>';
 document.getElementById("result-list").innerHTML=results.length?results.map(card).join(""):'<p class="muted">No results published yet.</p>';
 const admin=document.getElementById("admin-list");
 if(admin.style.display!=="none"){
  admin.innerHTML=data.map(x=>`<div class="card"><b>${safe(x.home_team)} vs ${safe(x.away_team)}</b><p class="muted">${safe(x.prediction)} | ${safe(x.status)}</p><div class="actions"><button onclick="finishPrediction('${x.id}')">Mark finished</button><button class="danger" onclick="deletePrediction('${x.id}')">Delete</button></div></div>`).join("");
 }
}
function card(x){
 return `<div class="card"><span class="tag">${safe(x.league)}</span><div class="teams">${safe(x.home_team)} vs ${safe(x.away_team)}</div><p>Tip: <b>${safe(x.prediction)}</b></p><p>Odds: ${safe(x.odds||"—")}</p><p class="muted">${safe(x.kickoff||"")}</p>${x.status==="finished"?`<p>Result: ${safe(x.result||"Finished")}</p>`:""}</div>`;
}
async function login(){
 const {data,error}=await db.auth.signInWithPassword({
  email:document.getElementById("email").value,
  password:document.getElementById("password").value
 });
 if(error){document.getElementById("message").textContent=error.message;return;}
 const {data:admin,error:adminError}=await db.from("admins").select("user_id").eq("user_id",data.user.id).maybeSingle();
 if(adminError||!admin){
  await db.auth.signOut();
  document.getElementById("message").textContent="This account is not an authorised administrator.";
  return;
 }
 document.getElementById("message").textContent="Login successful.";
 showAdmin();
}
function showAdmin(){
 document.getElementById("admin").style.display="block";
 document.getElementById("login").style.display="none";
 loadPredictions();
}
async function logout(){
 await db.auth.signOut();
 document.getElementById("admin").style.display="none";
 document.getElementById("login").style.display="block";
}
async function postPrediction(){
 const row={
  league:document.getElementById("league").value,
  home_team:document.getElementById("home").value,
  away_team:document.getElementById("away").value,
  prediction:document.getElementById("tip").value,
  odds:document.getElementById("odds").value,
  kickoff:document.getElementById("kickoff").value,
  status:"pending"
 };
 if(!row.home_team||!row.away_team||!row.prediction){
  document.getElementById("admin-message").textContent="Please enter both teams and a prediction.";
  return;
 }
 const {error}=await db.from("predictions").insert(row);
 document.getElementById("admin-message").textContent=error?error.message:"Prediction published!";
 if(!error){
  ["league","home","away","tip","odds","kickoff"].forEach(id=>document.getElementById(id).value="");
  loadPredictions();
 }
}
async function finishPrediction(id){
 const result=prompt("Enter the match result:");
 if(result===null)return;
 const {error}=await db.from("predictions").update({status:"finished",result}).eq("id",id);
 if(error)alert(error.message);else loadPredictions();
}
async function deletePrediction(id){
 if(!confirm("Delete this prediction?"))return;
 const {error}=await db.from("predictions").delete().eq("id",id);
 if(error)alert(error.message);else loadPredictions();
}
loadPredictions();
db.auth.getSession().then(async({data})=>{
 if(data.session){
  const {data:admin}=await db.from("admins").select("user_id").eq("user_id",data.session.user.id).maybeSingle();
  if(admin)showAdmin();
 }
});
</script>
</body>
</html>
